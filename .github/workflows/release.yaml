name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Committed workspace version to release (for example 0.3.0)"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_PACKAGER_VERSION: "0.11.8"

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ inputs.version }}
      tag: v${{ inputs.version }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the current remote main
        id: main-head
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git ls-remote --exit-code origin refs/heads/main)
          sha=${sha%%$'\t'*}
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.main-head.outputs.sha }}
          fetch-depth: 0

      - name: Read latest release state
        id: release-state
        uses: actions/github-script@v9
        with:
          script: |
            let latest = null;
            try {
              latest = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput("latest-tag", latest?.data.tag_name ?? "");

      - name: Resolve the source tag
        id: tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ steps.main-head.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release version must be MAJOR.MINOR.PATCH: $VERSION" >&2
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/v$VERSION" > /dev/null; then
            git fetch --no-tags origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          fi
          if sha=$(git rev-list --max-count=1 "refs/tags/v$VERSION" 2>/dev/null); then
            if [[ "$sha" != "$TARGET_SHA" ]] || ! git merge-base --is-ancestor origin/main "$TARGET_SHA"; then
              echo "existing v$VERSION must resolve to current main ($TARGET_SHA), found $sha; the head must retain its published history" >&2
              exit 1
            fi
            echo "state=existing" >> "$GITHUB_OUTPUT"
          else
            echo "state=new" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate a new workspace release version
        id: version
        if: steps.tag.outputs.state == 'new'
        env:
          SAYMORE_LATEST_TAG: ${{ steps.release-state.outputs.latest-tag }}
          SAYMORE_REQUESTED_VERSION: ${{ inputs.version }}
        run: cargo run -p xtask -- release-plan --github-output "$GITHUB_OUTPUT"

      - name: Require successful CI before creating a new tag
        if: steps.tag.outputs.state == 'new'
        uses: actions/github-script@v9
        env:
          SOURCE_SHA: ${{ steps.main-head.outputs.sha }}
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yaml",
              branch: "main",
              event: "push",
              status: "completed",
              head_sha: process.env.SOURCE_SHA,
              per_page: 10,
            });
            const successful = data.workflow_runs.some(
              (run) => run.head_sha === process.env.SOURCE_SHA && run.conclusion === "success",
            );
            if (!successful) {
              core.setFailed(`CI has not passed for release source ${process.env.SOURCE_SHA}`);
            }

      - name: Create or reuse the tag before building
        id: source
        shell: bash
        env:
          TAG: v${{ inputs.version }}
          TAG_STATE: ${{ steps.tag.outputs.state }}
          TARGET_SHA: ${{ steps.main-head.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$TAG_STATE" == new ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$TAG" -f message="Saymore $TAG" \
              -f object="$TARGET_SHA" -f type=commit
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$TARGET_SHA"
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          fi
          sha=$(git rev-list --max-count=1 "refs/tags/$TAG")
          if [[ "$sha" != "$TARGET_SHA" ]]; then
            echo "$TAG does not identify the approved main head $TARGET_SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  package-macos:
    name: Package macOS universal DMG
    needs: plan
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - name: Choose macOS signing mode
        id: apple-auth
        shell: bash
        run: |
          set -euo pipefail
          complete=true
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              complete=false
            fi
          done
          echo "signed=$complete" >> "$GITHUB_OUTPUT"
          if [[ "$complete" != true ]]; then
            sed -i '' '/^signing-identity = /d' apps/desktop/Cargo.toml
            echo "::warning::Apple credentials are incomplete; publishing an unsigned, unnotarized DMG."
          fi

      - name: Setup Rust targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install release tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}

      - name: Verify the tag's workspace version
        shell: bash
        run: |
          set -euo pipefail
          actual=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name == "xtask") | .version')
          test "$actual" = "${{ needs.plan.outputs.version }}"

      - name: Build both macOS architectures
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p saymore-desktop --release --target aarch64-apple-darwin
          cargo build -p saymore-desktop --release --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/saymore-desktop \
            target/x86_64-apple-darwin/release/saymore-desktop \
            -output target/universal-apple-darwin/release/saymore-desktop

      - name: Package DMG
        env:
          # cargo-packager skips Finder layout customization when CI=true.
          CI: "false"
        run: >-
          cargo packager --release --packages saymore-desktop --formats dmg
          --target universal-apple-darwin --out-dir dist

      - name: Notarize final DMG
        if: steps.apple-auth.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(apps/desktop/dist/*.dmg)
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo "expected exactly one DMG, found ${#dmgs[@]}" >&2
            exit 1
          fi

          xcrun notarytool submit "${dmgs[0]}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "${dmgs[0]}"
          xcrun stapler validate "${dmgs[0]}"
          spctl --assess --type open --context context:primary-signature \
            --verbose=4 "${dmgs[0]}"

      - name: Verify DMG presentation
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(apps/desktop/dist/*.dmg)
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo "expected exactly one DMG, found ${#dmgs[@]}" >&2
            exit 1
          fi

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT

          # Attaching without accepting input verifies that the DMG has no EULA prompt.
          hdiutil attach "${dmgs[0]}" -nobrowse -readonly -mountpoint "$mount_dir" </dev/null
          test -d "$mount_dir/Saymore.app"
          test -L "$mount_dir/Applications"
          test -f "$mount_dir/.background/dmg-background.png"
          test -s "$mount_dir/.DS_Store"
          strings "$mount_dir/.DS_Store" | grep -Fq "dmg-background.png"

          if [[ "${{ steps.apple-auth.outputs.signed }}" == true ]]; then
            codesign --verify --all-architectures --deep --strict --verbose=4 \
              "$mount_dir/Saymore.app"
            codesign -d --entitlements - --xml "$mount_dir/Saymore.app" \
              >entitlements.plist
            plutil -lint entitlements.plist
            test "$(/usr/libexec/PlistBuddy -c \
              'Print :com.apple.security.device.audio-input' entitlements.plist)" = true
            spctl --assess --type execute --verbose=4 "$mount_dir/Saymore.app"
          fi

      - name: Mark unsigned DMG
        if: steps.apple-auth.outputs.signed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for file in apps/desktop/dist/*.dmg; do
            mv "$file" "${file%.dmg}-unsigned.dmg"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: apps/desktop/dist/*.dmg
          if-no-files-found: error

  package-windows:
    name: Package Windows NSIS installer
    needs: plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Install release tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}

      - name: Verify the tag's workspace version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version=1 | ConvertFrom-Json
          $actual = @($metadata.packages | Where-Object { $_.name -eq 'xtask' }).version
          if ($actual.Count -ne 1 -or $actual[0] -ne '${{ needs.plan.outputs.version }}') {
            throw "Expected workspace version '${{ needs.plan.outputs.version }}', found '$actual'"
          }

      - name: Build application
        run: cargo build -p saymore-desktop --release

      - name: Package NSIS installer
        run: >-
          cargo packager --release --packages saymore-desktop --formats nsis
          --binaries-dir target/release --out-dir dist

      - name: Use user-facing installer name
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps\desktop\dist\saymore-desktop_*_*-setup.exe -File -ErrorAction Stop
          if ($installer.Count -ne 1) {
            throw "Expected exactly one Saymore NSIS installer, found $($installer.Count)"
          }
          Move-Item -LiteralPath $installer.FullName -Destination apps\desktop\dist\Saymore-Setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: apps/desktop/dist/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [plan, package-macos, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 0

      - name: Verify the tag's source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
        run: test "$(git rev-list --max-count=1 HEAD)" = "$SOURCE_SHA"

      - uses: actions/download-artifact@v8
        with:
          name: release-macos
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./* > SHA256SUMS

      - name: Create or repair GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --latest \
              --title "Saymore $TAG"
          fi
